<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Harelbeke & Live Clock</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent: #00897b;
      --accent-light: #e0f2f1;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* Live Clock Widget */
    .clock-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.25rem 2.5rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 2rem;
      width: 100%;
      max-width: 420px;
    }

    .clock-time {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .clock-date {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Information Card UI */
    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 1.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
    }

    .status-tag {
      display: inline-block;
      background-color: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      margin-top: 0.5rem;
    }

    /* Section Styling */
    .section {
      margin-bottom: 1.25rem;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }

    /* Hours Table */
    .hours-table {
      width: 100%;
      border-collapse: collapse;
    }

    .hours-table tr {
      border-bottom: 1px solid #f3f4f6;
    }

    .hours-table tr:last-child {
      border-bottom: none;
    }

    .hours-table td {
      padding: 0.5rem 0;
      font-size: 0.95rem;
    }

    .day {
      font-weight: 500;
      color: var(--text-main);
    }

    .time {
      text-align: right;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Location Details */
    .location-box {
      background-color: #f9fafb;
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .location-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .icon {
      color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Real-Time Clock & Date -->
  <div class="clock-container">
    <div class="clock-time" id="time">00:00:00</div>
    <div class="clock-date" id="date">--</div>
  </div>

  <!-- Place Info Card -->
  <div class="info-card">
    <div class="card-header">
      <div class="card-title">Library Harelbeke</div>
      <span class="status-tag">Open now</span>
    </div>

    <!-- Opening Hours -->
    <div class="section">
      <div class="section-title">Opening Hours</div>
      <table class="hours-table">
        <tr>
          <td class="day">Thursday</td>
          <td class="time">1:30 – 7 PM</td>
        </tr>
        <tr>
          <td class="day">Friday</td>
          <td class="time">Closed</td>
        </tr>
        <tr>
          <td class="day">Saturday</td>
          <td class="time">9 AM – Noon</td>
        </tr>
        <tr>
          <td class="day">Sunday</td>
          <td class="time">Closed</td>
        </tr>
        <tr>
          <td class="day">Monday</td>
          <td class="time">3 – 6 PM</td>
        </tr>
        <tr>
          <td class="day">Tuesday</td>
          <td class="time">1:30 – 7 PM</td>
        </tr>
        <tr>
          <td class="day">Wednesday</td>
          <td class="time">1:30 – 6 PM</td>
        </tr>
      </table>
    </div>

    <!-- Address & Location Details -->
    <div class="section">
      <div class="section-title">Location Details</div>
      <div class="location-box">
        <div class="location-item">
          <span class="icon">📍</span>
          <span>Eilandstraat 2, 8530 Harelbeke, Belgium</span>
        </div>
        <div class="location-item">
          <span class="icon">🏢</span>
          <span>Floor 1</span>
        </div>
        <div class="location-item">
          <span class="icon">🌐</span>
          <span>Plus Code: V837+VG Harelbeke, Belgium</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      // Formatting Time (12-hour format with AM/PM)
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      document.getElementById('time').textContent = now.toLocaleTimeString('en-US', timeOptions);

      // Formatting Date
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-US', dateOptions);
    }

    // Run clock on load and update every second
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
